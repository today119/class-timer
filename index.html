<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>째깍째깍 타이머</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root{
  --c:#3fbf7f; --c2:#2e9c64; --tint:#eafaf1;
  --ink:#3b3550; --sub:#8a83a0; --line:#e8e2f2; --grape:#8b6fd6; --grape-d:#6f55b8;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0; font-family:'Jua',system-ui,'Apple SD Gothic Neo',sans-serif; color:var(--ink); overflow:hidden;
  background:radial-gradient(circle at 50% 45%,#fff 0,var(--tint) 75%); transition:background 1s}
button{font-family:inherit; color:inherit; cursor:pointer; border:none; background:none}
input{font-family:inherit; color:var(--ink)}
.btn{border-radius:16px; padding:.5em 1em; font-size:clamp(16px,2.3vh,22px); background:#fff; border:2px solid var(--line);
  box-shadow:0 4px 0 rgba(0,0,0,.08); white-space:nowrap}
.btn:active{transform:translateY(3px); box-shadow:0 1px 0 rgba(0,0,0,.08)}
.btn.go{background:var(--grape); color:#fff; border-color:var(--grape-d)}

/* ── 맞추기 화면 ── */
#setup{position:fixed; inset:0; overflow:auto; display:flex; align-items:center; justify-content:center; padding:20px;
  background:linear-gradient(150deg,#fff5f0,#f3efff 55%,#eefaff)}
.card{background:#fff; border:2px solid var(--line); border-radius:28px; padding:clamp(18px,3vh,32px); width:min(760px,100%);
  box-shadow:0 8px 0 rgba(0,0,0,.06)}
.card h1{margin:0 0 4px; font-weight:normal; font-size:clamp(28px,4.5vh,44px); text-align:center}
.card .sub{color:var(--sub); text-align:center; margin:0 0 18px; font-size:clamp(14px,2vh,18px)}
.lab{font-size:clamp(15px,2.1vh,19px); color:var(--sub); margin:16px 0 8px}
#actName,#swName{width:100%; font-size:clamp(20px,3vh,28px); padding:.4em .7em; border:2px solid var(--line); border-radius:16px; outline:none; background:#fcfbff}
#actName:focus,#swName:focus{border-color:var(--grape)}
.presets{display:grid; grid-template-columns:repeat(6,1fr); gap:8px}
.presets button{font-size:clamp(18px,2.8vh,26px); padding:.45em 0; border-radius:16px; border:2px solid var(--line); background:#fff; box-shadow:0 3px 0 rgba(0,0,0,.06)}
.presets button.on{background:#f1ecff; border-color:var(--grape); color:var(--grape-d)}
.custom{display:flex; align-items:center; gap:8px; justify-content:center; margin-top:10px; font-size:clamp(18px,2.6vh,24px)}
.custom input{width:3.2em; text-align:center; font-size:clamp(26px,4vh,38px); padding:.15em; border:2px solid var(--line); border-radius:14px; outline:none}
.custom input:focus{border-color:var(--grape)}
.custom span{color:var(--sub)}
.styles{display:grid; grid-template-columns:repeat(4,1fr); gap:10px}
.styles button{border:3px solid var(--line); border-radius:20px; padding:10px 6px 8px; background:#fff; font-size:clamp(15px,2.2vh,20px)}
.styles button svg{width:min(80px,10vh); height:min(80px,10vh); display:block; margin:0 auto 4px}
.styles button.on{border-color:var(--grape); background:#f7f3ff}
.row2{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:20px; flex-wrap:wrap}
.tog{display:flex; align-items:center; gap:8px; font-size:clamp(16px,2.2vh,20px); color:var(--sub); cursor:pointer}
.tog input{width:22px; height:22px; accent-color:var(--grape)}
#btnStart{font-size:clamp(24px,3.6vh,34px); padding:.45em 1.6em; border-radius:22px}

/* ── 타이머 화면 ── */
#stage{position:fixed; inset:0; display:none; flex-direction:column; align-items:center; padding:2.5vh 3vw 2vh}
body.run #stage{display:flex}
body.run #setup{display:none}
#title{font-size:clamp(28px,6.5vh,72px); text-align:center; line-height:1.15; min-height:1em; color:var(--ink); max-width:94vw;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
#main{flex:1; min-height:0; width:100%; display:flex; align-items:center; justify-content:center; gap:4vw}
#vis{position:relative; height:min(70vh,84vw); aspect-ratio:1; flex:none}
#vis svg{width:100%; height:100%; display:block; overflow:visible}
#time{font-size:clamp(70px,22vh,280px); line-height:1; color:var(--c2); font-variant-numeric:tabular-nums; letter-spacing:.02em;
  transition:color .6s; text-shadow:0 6px 0 rgba(0,0,0,.06)}
/* 원 모양: 숫자는 원 안에 */
body.s-ring #time{position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); font-size:min(17vh,20vw)}
body.s-ring #main{gap:0}
#vis.beat{animation:beat 1s ease-in-out infinite}
#vis.beat2{animation:beat .5s ease-in-out infinite}
.flk{animation:flk .18s ease-in-out infinite alternate; transform-origin:0 0}
@keyframes flk{from{transform:scale(1,1) rotate(-3deg)}to{transform:scale(.92,1.1) rotate(3deg)}}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.045)}30%{transform:scale(.99)}45%{transform:scale(1.03)}}
#msg{font-size:clamp(18px,3.4vh,34px); color:var(--c2); min-height:1.3em; transition:color .6s}
#ctrl{display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:1vh; transition:opacity .4s}
body.idle #ctrl{opacity:.12}
#ctrl .btn{font-size:clamp(16px,2.4vh,24px)}

/* 마지막 10초 큰 숫자 */
#big{position:fixed; inset:0; display:grid; place-items:center; pointer-events:none; z-index:20}
#big span{font-size:min(70vh,90vw); line-height:1; color:#ff4d5e; opacity:0; text-shadow:0 10px 0 rgba(160,0,20,.15)}
#big span.pop{animation:pop 1s ease-out}
@keyframes pop{0%{opacity:.0; transform:scale(1.6)}12%{opacity:.85}100%{opacity:0; transform:scale(.7)}}

/* 끝 */
#end{position:fixed; inset:0; z-index:30; display:none; place-items:center; background:rgba(255,77,94,.92); color:#fff; text-align:center; cursor:pointer}
#end.on{display:grid}
#end .e1{font-size:clamp(70px,20vh,240px); line-height:1.05; animation:shake .5s ease-in-out infinite}
#end .e2{font-size:clamp(24px,5vh,56px); margin-top:2vh}
#end .e3{font-size:clamp(14px,2.2vh,20px); opacity:.8; margin-top:3vh}
@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-4deg) scale(1.04)}75%{transform:rotate(4deg) scale(1.04)}}
#end i{position:absolute; top:-20px; width:12px; height:18px; border-radius:3px; animation:fall linear forwards}
@keyframes fall{to{transform:translateY(115vh) rotate(720deg)}}

/* 세로 화면(태블릿 세로 등) */
@media (max-width:620px){ .styles{grid-template-columns:repeat(2,1fr)} .presets{grid-template-columns:repeat(3,1fr)} }
@media (max-aspect-ratio:1/1){
  #main{flex-direction:column; gap:2vh}
  #vis{height:min(52vh,86vw)}
  #time{font-size:clamp(60px,14vh,200px)}
}

/* ── 모드 고르기 ── */
.modes{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:14px 0 6px}
.modes button{border:3px solid var(--line); border-radius:20px; padding:12px 8px; font-size:clamp(20px,3vh,28px); background:#fff; line-height:1.2}
.modes button small{display:block; font-size:clamp(13px,1.8vh,16px); color:var(--sub); margin-top:3px}
.modes button.on{border-color:var(--grape); background:#f4efff; color:var(--grape-d)}
body.m-sw #tmSec{display:none} body:not(.m-sw) #swSec{display:none}
.swnow{margin:16px 0 0; padding:14px; border-radius:18px; background:#fff4f6; border:2px dashed #ffc2cd; text-align:center; font-size:clamp(17px,2.4vh,22px); color:#b2475d}
.swnow b{font-size:1.6em; font-weight:normal}

/* ── 시간 모으기 화면 ── */
#sw{position:fixed; inset:0; display:none; flex-direction:column; align-items:center; justify-content:center; gap:1.4vh; padding:3vh 3vw;
  background:radial-gradient(circle at 50% 45%,#fff 0,#f1efff 80%); text-align:center}
body.swrun #sw{display:flex} body.swrun #setup{display:none}
body.swon #sw{animation:swbg 1.6s ease-in-out infinite}
@keyframes swbg{0%,100%{background:radial-gradient(circle at 50% 45%,#fff 0,#ffe3e7 80%)}50%{background:radial-gradient(circle at 50% 45%,#fff3f4 0,#ffb9c3 80%)}}
#swTitle{font-size:clamp(28px,6.5vh,72px); line-height:1.15}
#swBadge{font-size:clamp(18px,3.4vh,34px); color:var(--sub); padding:.2em .9em; border-radius:999px; background:rgba(255,255,255,.7)}
body.swon #swBadge{color:#fff; background:#ff4d5e; animation:beat 1s ease-in-out infinite}
#swTime{font-size:clamp(90px,28vh,340px); line-height:1; color:#6f55b8; font-variant-numeric:tabular-nums; text-shadow:0 8px 0 rgba(0,0,0,.06)}
body.swon #swTime{color:#e02a3d}
#swCoins{font-size:clamp(20px,4vh,44px); min-height:1.2em; max-width:90vw; line-height:1.1}
#swCoins small{font-size:.6em; color:var(--sub)}
#swGo{font-size:clamp(26px,5vh,54px); padding:.4em 1.6em; border-radius:999px; background:#ff6b81; color:#fff; border:4px solid #e04862; box-shadow:0 7px 0 #c73a52}
#swGo:active{transform:translateY(5px); box-shadow:0 2px 0 #c73a52}
body.swon #swGo{background:#5b5470; border-color:#3f3953; box-shadow:0 7px 0 #2c2740}
#swLog{display:flex; flex-wrap:wrap; gap:6px; justify-content:center; max-width:92vw; max-height:14vh; overflow:auto}
#swLog span{font-size:clamp(14px,2vh,19px); padding:.2em .7em; border-radius:999px; background:#fff; border:2px solid #ffd0d8; color:#b2475d}
.swctl{display:flex; gap:8px; flex-wrap:wrap; justify-content:center; transition:opacity .4s}
.swctl .btn{font-size:clamp(15px,2.2vh,21px)}
body.idle .swctl{opacity:.15}

/* ── 📢 집중 효과음 ── */
#fxBtn{position:fixed; right:18px; bottom:18px; z-index:40; border-radius:999px; padding:.45em 1em; font-size:clamp(17px,2.4vh,24px);
  background:#ffd23f; border:3px solid #e6b400; box-shadow:0 5px 0 #c99a00; color:#5a4300; transition:opacity .4s}
#fxBtn:active{transform:translateY(4px); box-shadow:0 1px 0 #c99a00}
body.idle #fxBtn{opacity:.25}
#fxPanel{position:fixed; right:18px; bottom:84px; z-index:41; width:min(560px,calc(100vw - 36px)); max-height:70vh; overflow:auto; background:#fff;
  border:3px solid #ffe58a; border-radius:24px; padding:14px; box-shadow:0 14px 40px rgba(60,40,0,.2); display:none}
#fxPanel.on{display:block}
#fxPanel h3{margin:0 0 8px; font-weight:normal; font-size:clamp(18px,2.6vh,24px)}
#fxPanel .g{display:grid; grid-template-columns:1fr 1fr; gap:8px}
#fxPanel .g button{display:flex; align-items:center; gap:8px; text-align:left; padding:10px 12px; border-radius:16px; border:2px solid #f3ead0; background:#fffdf5;
  font-size:clamp(15px,2vh,19px); line-height:1.25}
#fxPanel .g button:hover{background:#fff6d6; border-color:#ffd23f}
#fxPanel .g button b{font-size:1.7em; font-weight:normal; flex:none}
#fxPanel .opt{display:flex; gap:14px; flex-wrap:wrap; margin-top:10px; color:var(--sub); font-size:clamp(14px,1.9vh,17px)}
#fxPanel .opt label{display:flex; align-items:center; gap:6px; cursor:pointer}
#fxShow{position:fixed; inset:0; z-index:60; display:none; place-items:center; pointer-events:none}
#fxShow.on{display:grid}
#fxShow .box{background:rgba(255,255,255,.96); border:6px solid #ffd23f; border-radius:40px; padding:4vh 5vw; text-align:center; max-width:90vw;
  box-shadow:0 20px 60px rgba(0,0,0,.25); animation:fxIn .5s cubic-bezier(.2,1.6,.4,1)}
#fxShow .em{font-size:clamp(70px,18vh,200px); line-height:1; animation:fxWig .6s ease-in-out infinite}
#fxShow .tx{font-size:clamp(30px,7vh,84px); line-height:1.2; margin-top:2vh; color:#3b3550; word-break:keep-all}
@keyframes fxIn{from{transform:scale(.3) rotate(-8deg); opacity:0}to{transform:scale(1) rotate(0); opacity:1}}
@keyframes fxWig{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg) scale(1.08)}}
</style>
</head>
<body class="s-ring">

<div id="setup">
  <div class="card">
    <h1>⏰ 째깍째깍 타이머</h1>
    <div class="modes" id="modes"><button data-mode="timer">⏰ 타이머<small>정한 시간이 줄어들어요</small></button><button data-mode="sw">⏱️ 시간 모으기<small>누를 때마다 이어서 쌓여요</small></button></div>
    <div id="swSec">
      <div class="lab">무엇을 모으는 시간인가요?</div>
      <input id="swName" placeholder="예) 떠든 시간 → 점심시간에서 빼요" maxlength="30">
      <div class="swnow" id="swNow"></div>
      <div class="row2"><button class="btn" id="swReset0">🗑 0으로</button><button class="btn go" id="btnSw">▶ 스톱워치 열기</button></div>
    </div>
    <div id="tmSec">
    <p class="sub">시간을 고르고 「시작」을 누르면 화면 가득 타이머가 나와요</p>

    <div class="lab">무엇을 하는 시간인가요? (안 적어도 돼요)</div>
    <input id="actName" placeholder="예) 모둠 토의, 정리 시간" maxlength="30">

    <div class="lab">시간</div>
    <div class="presets" id="presets"></div>
    <div class="custom"><input id="inM" inputmode="numeric" maxlength="3"><span>분</span><input id="inS" inputmode="numeric" maxlength="2"><span>초</span></div>

    <div class="lab">모양</div>
    <div class="styles" id="styles"></div>

    <div class="row2">
      <label class="tog"><input type="checkbox" id="snd"> 🔔 소리 (끝날 때 종, 마지막 10초 째깍)</label>
      <button class="btn go" id="btnStart">▶ 시작</button>
    </div>
    </div>
  </div>
</div>

<div id="stage">
  <div id="title"></div>
  <div id="main"><div id="vis"></div><div id="time">0:00</div></div>
  <div id="msg"></div>
  <div id="ctrl">
    <button class="btn" id="bPause">⏸ 잠깐 멈춤</button>
    <button class="btn" id="bPlus">＋1분</button>
    <button class="btn" id="bMinus">－1분</button>
    <button class="btn" id="bRestart">↺ 처음부터</button>
    <button class="btn" id="bFull">⛶ 전체화면</button>
    <button class="btn" id="bBack">⚙️ 다시 맞추기</button>
  </div>
</div>
<div id="sw">
  <div id="swTitle"></div>
  <div id="swBadge">⏸ 멈춰 있어요</div>
  <div id="swTime">0:00</div>
  <div id="swCoins"></div>
  <button id="swGo">▶ 모으기 시작</button>
  <div id="swLog"></div>
  <div class="swctl">
    <button class="btn" data-adj="-10">－10초</button><button class="btn" data-adj="10">＋10초</button>
    <button class="btn" id="swReset">🗑 0으로</button><button class="btn" id="swFull">⛶ 전체화면</button><button class="btn" id="swBack">⚙️ 처음 화면</button>
  </div>
</div>
<button id="fxBtn">📢 집중 효과음</button>
<div id="fxPanel"><h3>📢 집중 효과음 <small style="color:var(--sub);font-size:.7em">누르면 소리 + 목소리 + 큰 글씨</small></h3><div class="g" id="fxGrid"></div>
  <div class="opt"><label><input type="checkbox" id="fxVoice"> 🗣️ 목소리로 읽어 주기</label><label><input type="checkbox" id="fxBanner"> 🖼️ 화면에 크게 보여 주기</label></div></div>
<div id="fxShow"><div class="box"><div class="em" id="fxEm"></div><div class="tx" id="fxTx"></div></div></div>
<div id="big"><span></span></div>
<div id="end"><div><div class="e1">시간 끝! ⏰</div><div class="e2" id="endName"></div><div class="e3">화면을 누르면 닫혀요</div></div></div>

<script>
const KEY='class_timer_v1';
const $=s=>document.querySelector(s);
const PRESETS=[1,2,3,5,10,15];
let S=Object.assign({name:'',m:3,s:0,style:'ring',sound:true},(()=>{try{return JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){return{}}})());
const save=()=>{ try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){} };

/* 각 모양은 svg() 로 그림 틀을 만들고, draw(p, root) 로 남은 비율 p(1→0)만큼 그린다.
   root 안에서 data-k 로 찾으니 고르기 화면 미리보기에도 같은 그림을 쓸 수 있다 */
const q=(r,k)=>r.querySelector(`[data-k="${k}"]`);
const at=(el,o)=>{ if(el) for(const k in o) el.setAttribute(k,o[k]); };
const STYLES={
  ring:{nm:'⭕ 줄어드는 원', svg:()=>`<svg viewBox="0 0 200 200">
      <circle cx="100" cy="100" r="86" fill="#fff" stroke="rgba(0,0,0,.06)" stroke-width="22"/>
      <circle data-k="rg" cx="100" cy="100" r="86" fill="none" stroke="var(--c)" stroke-width="22" stroke-linecap="round"
        transform="rotate(-90 100 100)" pathLength="1000" stroke-dasharray="1000 1000"/>
      <g data-k="dot"><circle r="15" fill="#fff" stroke="var(--c2)" stroke-width="4"/><text font-size="17" text-anchor="middle" dominant-baseline="central" y="1">⭐</text></g></svg>`,
    draw(p,r){ at(q(r,'rg'),{'stroke-dasharray':`${1000*p} 1000`});
      const a=-Math.PI/2+2*Math.PI*p; const d=q(r,'dot');
      d.setAttribute('transform',`translate(${100+86*Math.cos(a)} ${100+86*Math.sin(a)})`); d.style.display=p>0.002?'':'none'; } },
  glass:{nm:'⏳ 모래시계', svg:()=>{ const u=Math.random().toString(36).slice(2,7); return `<svg viewBox="0 0 200 200">
      <defs><clipPath id="ct${u}"><path d="M52 22 H148 C148 62 112 84 104 100 H96 C88 84 52 62 52 22Z"/></clipPath>
        <clipPath id="cb${u}"><path d="M96 100 H104 C112 116 148 138 148 178 H52 C52 138 88 116 96 100Z"/></clipPath></defs>
      <path d="M52 22 H148 C148 62 112 84 104 100 C112 116 148 138 148 178 H52 C52 138 88 116 96 100 C88 84 52 62 52 22Z" fill="rgba(255,255,255,.8)"/>
      <g clip-path="url(#ct${u})"><rect data-k="top" x="40" width="120" y="22" height="78" fill="var(--c)"/></g>
      <g clip-path="url(#cb${u})"><path data-k="bot" fill="var(--c)"/></g>
      <rect data-k="stream" x="98" y="98" width="4" height="78" rx="2" fill="var(--c)"/>
      <path d="M52 22 H148 C148 62 112 84 104 100 C112 116 148 138 148 178 H52 C52 138 88 116 96 100 C88 84 52 62 52 22Z" fill="none" stroke="#c9a46a" stroke-width="5" stroke-linejoin="round"/>
      <rect x="38" y="10" width="124" height="14" rx="7" fill="#c8843f"/><rect x="38" y="176" width="124" height="14" rx="7" fill="#c8843f"/>
      <ellipse cx="72" cy="45" rx="6" ry="14" fill="#fff" opacity=".7"/></svg>`; },
    draw(p,r){ const top=22+78*(1-p); at(q(r,'top'),{y:top,height:Math.max(0,100-top)});
      const h=74*(1-p), base=178, peak=base-h-10*(1-p);
      at(q(r,'bot'),{d:`M40 ${base} L40 ${base-h} Q100 ${peak-6} 160 ${base-h} L160 ${base}Z`});
      const st=q(r,'stream'); st.style.display=(p>0.003&&p<0.999)?'':'none'; at(st,{height:Math.max(0,peak-98)}); } },
  ice:{nm:'🍦 녹는 아이스크림', svg:()=>`<svg viewBox="0 0 200 200">
      <ellipse data-k="pud" cx="100" cy="186" rx="10" ry="4" fill="var(--c)" opacity=".55"/>
      <path d="M66 104 L100 182 L134 104Z" fill="#f2b766" stroke="#c8843f" stroke-width="4" stroke-linejoin="round"/>
      <path d="M74 116 L118 116 M80 132 L112 132 M86 148 L106 148 M84 108 L108 160 M116 108 L96 160" stroke="#c8843f" stroke-width="2.5" opacity=".6"/>
      <path data-k="sc" fill="var(--c)"/><circle data-k="hl" r="8" fill="#fff" opacity=".55"/>
      <text data-k="cherry" font-size="22" text-anchor="middle" x="100">🍒</text><path data-k="drip" fill="var(--c)"/></svg>`,
    draw(p,r){ const R=8+40*Math.sqrt(p), cy=104-R*0.72;

/* ── 맞추기 화면 ── */
function drawSetup(){
  $('#actName').value=S.name; $('#inM').value=S.m; $('#inS').value=S.s; $('#snd').checked=S.sound;
  $('#presets').innerHTML=PRESETS.map(m=>`<button data-m="${m}" class="${S.m==m&&!+S.s?'on':''}">${m}분</button>`).join('');
  $('#styles').innerHTML=Object.entries(STYLES).map(([k,v])=>`<button data-st="${k}" class="${S.style===k?'on':''}">${v.svg()}<span>${v.nm}</span></button>`).join('');
  document.querySelectorAll('#styles [data-st]').forEach(b=>STYLES[b.dataset.st].draw(.6,b));
}
$('#presets').onclick=e=>{ const b=e.target.closest('[data-m]'); if(!b) return; S.m=+b.dataset.m; S.s=0; save(); drawSetup(); };
$('#styles').onclick=e=>{ const b=e.target.closest('[data-st]'); if(!b) return; S.style=b.dataset.st; save(); drawSetup(); };
$('#actName').oninput=e=>{ S.name=e.target.value; save(); };
['inM','inS'].forEach(id=>$('#'+id).oninput=e=>{ e.target.value=e.target.value.replace(/\D/g,''); S.m=+$('#inM').value||0; S.s=Math.min(59,+$('#inS').value||0); save();
  document.querySelectorAll('#presets button').forEach(b=>b.classList.toggle('on',+b.dataset.m===S.m&&!S.s)); });
$('#snd').onchange=e=>{ S.sound=e.target.checked; save(); };

/* ── 소리 (Web Audio) ── */
let AC=null;
function ac(){ try{ if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==='suspended') AC.resume(); }catch(e){ return null; } return AC; }
function tone(f,dur,type,vol,delay){ if(!S.sound) return; const c=ac(); if(!c) return; const t=c.currentTime+(delay||0);
  const o=c.createOscillator(), g=c.createGain(); o.type=type||'sine'; o.frequency.value=f;
  g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(vol||.25,t+.01); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g).connect(c.destination); o.start(t); o.stop(t+dur+.05); }
const tick=last=>tone(last?1320:880,.09,'square',.08);
function bell(){ [0,.55,1.1].forEach(d=>{ tone(1046,1.4,'sine',.3,d); tone(1568,1.0,'sine',.12,d); tone(523,1.6,'triangle',.12,d); }); }

/* ── 타이머 ── */
let total=0, endAt=0, left=0, running=false, lastSec=-1, raf=0;
function fmt(t){ t=Math.max(0,Math.ceil(t)); const m=Math.floor(t/60), s=t%60; return `${m}:${String(s).padStart(2,'0')}`; }
/* 남은 시간에 따라 색: 초록 → 노랑(절반) → 주황(1분 전) → 빨강(10초 전) */
function phase(t,p){ return t<=10?'red': t<=60?'orange': p<=.5?'yellow':'green'; }
const PH={green:['#3fbf7f','#2e9c64','#eafaf1'], yellow:['#f5c518','#c99a00','#fff9e0'], orange:['#ff9a3c','#e0741a','#fff0e2'], red:['#ff4d5e','#e02a3d','#ffe8ea']};
const MSG={green:'', yellow:'⏳ 절반 지났어요', orange:'🏃 1분 남았어요! 마무리해요', red:'🔥 곧 끝나요!'};
let curPh='';
function paint(){
  const now=performance.now(); if(running) left=Math.max(0,(endAt-now)/1000);
  const p=total?left/total:0; const ph=phase(left,p);
  if(ph!==curPh){ curPh=ph; const [c,c2,tint]=PH[ph]; const r=document.documentElement.style;
    r.setProperty('--c',c); r.setProperty('--c2',c2); r.setProperty('--tint',tint); }
  $('#msg').textContent=left<=0?'⏰ 시간 끝!': running?MSG[ph]: '⏸ 잠깐 멈췄어요';
  STYLES[S.style].draw(p,$('#vis'));
  $('#time').textContent=fmt(left);
  const v=$('#vis'); v.classList.toggle('beat',running&&left<=60&&left>10); v.classList.toggle('beat2',running&&left<=10&&left>0);
  const sec=Math.ceil(left);
  if(running && sec!==lastSec){ lastSec=sec;
    if(sec<=10&&sec>0){ const b=$('#big span'); b.textContent=sec; b.classList.remove('pop'); void b.offsetWidth; b.classList.add('pop'); tick(sec<=3); } }
  if(running && left<=0){ running=false; finish(); return; }
  if(running) raf=requestAnimationFrame(paint);
}
function start(){
  total=(+S.m||0)*60+(+S.s||0); if(total<=0){ $('#inM').focus(); return; }
  ac(); document.body.className='run s-'+S.style;
  $('#title').textContent=S.name||''; $('#vis').innerHTML=STYLES[S.style].svg();
  left=total; curPh=''; lastSec=-1; resume();
  fullOn(); idleKick();
}
function resume(){ if(left<=0) return; running=true; endAt=performance.now()+left*1000; $('#bPause').textContent='⏸ 잠깐 멈춤'; cancelAnimationFrame(raf); paint(); }
function pause(){ if(!running) return; running=false; left=Math.max(0,(endAt-performance.now())/1000); cancelAnimationFrame(raf); $('#bPause').textContent='▶ 계속'; paint(); }
function add(sec){ if(running){ endAt+=sec*1000; left=(endAt-performance.now())/1000; if(left<1){ endAt=performance.now()+1000; } }
  else { left=Math.max(0,left+sec); }
  total=Math.max(total,left); lastSec=-1; if(!running) paint(); }
function finish(){
  $('#time').textContent='0:00'; STYLES[S.style].draw(0,$('#vis')); $('#vis').className='';
  $('#endName').textContent=S.name? `「${S.name}」 시간이 끝났어요` : '';
  const e=$('#end'); e.querySelectorAll('i').forEach(x=>x.remove());
  const cols=['#ffe066','#fff','#8be0ff','#b6ff8b','#ffb3d1'];
  for(let k=0;k<60;k++){ const i=document.createElement('i'); i.style.left=Math.random()*100+'vw'; i.style.background=cols[k%5];
    i.style.animationDuration=(2.2+Math.random()*2.5)+'s'; i.style.animationDelay=(Math.random()*1.2)+'s'; e.appendChild(i); }
  e.classList.add('on'); bell(); $('#bPause').textContent='▶ 계속';
}
$('#end').onclick=()=>$('#end').classList.remove('on');
$('#btnStart').onclick=start;
$('#bPause').onclick=()=> running? pause() : resume();
$('#bPlus').onclick=()=>add(60);
$('#bMinus').onclick=()=>add(-60);
$('#bRestart').onclick=()=>{ $('#end').classList.remove('on'); left=total=(+S.m||0)*60+(+S.s||0); lastSec=-1; curPh=''; resume(); };
$('#bBack').onclick=()=>{ running=false; cancelAnimationFrame(raf); $('#end').classList.remove('on'); document.body.className='s-'+S.style; drawSetup(); drawMode(); };
function fullOn(){ const d=document.documentElement; if(d.requestFullscreen&&!document.fullscreenElement) d.requestFullscreen().catch(()=>{}); }
$('#bFull').onclick=()=> document.fullscreenElement? document.exitFullscreen() : fullOn();
/* 가만히 있으면 버튼을 흐리게 → 화면이 깔끔 */
let idleT=0; function idleKick(){ document.body.classList.remove('idle'); clearTimeout(idleT); idleT=setTimeout(()=>{ if(/\b(run|swrun)\b/.test(document.body.className)) document.body.classList.add('idle'); },4000); }
['mousemove','pointerdown','keydown'].forEach(ev=>document.addEventListener(ev,idleKick));
document.addEventListener('keydown',e=>{
  if(document.body.classList.contains('swrun')){ if(e.key===' '){ e.preventDefault(); swToggle(); } return; }
  if(!document.body.classList.contains('run')){ if(e.key==='Enter'&&e.target.tagName!=='BUTTON') (S.mode==='sw'?openSw():start()); return; }
  if(e.key===' '){ e.preventDefault(); if($('#end').classList.contains('on')) { $('#end').classList.remove('on'); return; } running?pause():resume(); }
  if(e.key==='Escape') $('#end').classList.remove('on');
});
document.addEventListener('visibilitychange',()=>{ if(document.hidden) return; if(running){ cancelAnimationFrame(raf); paint(); } if(document.body.classList.contains('swrun')) swPaint(); });

/* ── ⏱️ 시간 모으기: 누를 때마다 이어서 쌓인다. 새로고침해도 남도록 시각(Date.now)으로 저장 ── */
S.mode=S.mode||'timer'; S.swName=S.swName??'떠든 시간';
S.sw=Object.assign({acc:0, at:null, log:[]},S.sw||{});
const swTotal=()=>S.sw.acc+(S.sw.at?Date.now()-S.sw.at:0);
function hms(ms){ const t=Math.floor(ms/1000), h=Math.floor(t/3600), m=Math.floor(t%3600/60), s=t%60;
  return h? `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}` : `${m}:${String(s).padStart(2,'0')}`; }
function kor(ms){ const t=Math.round(ms/1000), m=Math.floor(t/60), s=t%60; return m? (s?`${m}분 ${s}초`:`${m}분`) : `${s}초`; }
function drawMode(){ document.body.classList.toggle('m-sw',S.mode==='sw');
  document.querySelectorAll('#modes button').forEach(b=>b.classList.toggle('on',b.dataset.mode===S.mode));
  $('#swName').value=S.swName;
  const t=swTotal(); $('#swNow').innerHTML= t||S.sw.at? `지금까지 모인 시간 <b>${hms(t)}</b>${S.sw.log.length?` · ${S.sw.log.length}번`:''}${S.sw.at?' · 🔴 모으는 중':''}` : '아직 모인 시간이 없어요';
}
$('#modes').onclick=e=>{ const b=e.target.closest('[data-mode]'); if(!b) return; S.mode=b.dataset.mode; save(); drawMode(); };
$('#swName').oninput=e=>{ S.swName=e.target.value; save(); };
let swRaf=0;
function swPaint(){
  const t=swTotal(); $('#swTime').textContent=hms(t);
  const mins=Math.floor(t/60000);
  $('#swCoins').innerHTML= mins? (mins<=20? '🪙'.repeat(mins) : '🪙'.repeat(10)+` <small>× ${mins}</small>`)+` <small>${mins}분</small>` : '';
  document.body.classList.toggle('swon',!!S.sw.at);
  $('#swBadge').textContent= S.sw.at? '🔴 시간 모으는 중…' : '⏸ 멈춰 있어요';
  $('#swGo').textContent= S.sw.at? '⏸ 멈춤' : (S.sw.acc? '▶ 이어서 모으기' : '▶ 모으기 시작');
  const L=S.sw.log; $('#swLog').innerHTML=L.map((d,i)=>`<span>${i+1}번 · ${kor(d)}</span>`).join('')+(S.sw.at?`<span style="border-color:#ff4d5e">${L.length+1}번 · 모으는 중</span>`:'');
  cancelAnimationFrame(swRaf); if(S.sw.at && document.body.classList.contains('swrun')) swRaf=requestAnimationFrame(swPaint);
}
function swToggle(){
  if(S.sw.at){ const d=Date.now()-S.sw.at; S.sw.acc+=d; S.sw.log.push(d); S.sw.at=null; tone(660,.12,'sine',.25); tone(440,.2,'sine',.25,.13); }
  else { S.sw.at=Date.now(); tone(880,.25,'square',.12); }
  save(); swPaint();
}
function swReset(){ if(swTotal()>0 && !confirm('모은 시간을 0으로 지울까요?')) return; S.sw={acc:0,at:null,log:[]}; save(); swPaint(); drawMode(); }
function openSw(){ ac(); document.body.className='swrun'; $('#swTitle').textContent=S.swName||''; swPaint(); idleKick(); }
$('#btnSw').onclick=openSw;
$('#swReset0').onclick=swReset;
$('#swGo').onclick=swToggle;
$('#swReset').onclick=swReset;
$('#swFull').onclick=()=> document.fullscreenElement? document.exitFullscreen() : fullOn();
$('#swBack').onclick=()=>{ cancelAnimationFrame(swRaf); document.body.className='s-'+S.style; drawSetup(); drawMode(); };
document.querySelector('.swctl').addEventListener('click',e=>{ const b=e.target.closest('[data-adj]'); if(!b) return;
  S.sw.acc=Math.max(-(S.sw.at?Date.now()-S.sw.at:0), S.sw.acc+(+b.dataset.adj)*1000); save(); swPaint(); });

/* ── 📢 집중 효과음: 짧은 효과음 → 멘트(음성 합성) + 큰 글씨 ── */
S.fxVoice=S.fxVoice??true; S.fxBanner=S.fxBanner??true;
function fx(f,dur,type,vol,delay,slide){ const c=ac(); if(!c) return; const t=c.currentTime+(delay||0);
  const o=c.createOscillator(), g=c.createGain(); o.type=type||'sine'; o.frequency.setValueAtTime(f,t);
  if(slide) o.frequency.exponentialRampToValueAtTime(slide,t+dur);
  g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(vol||.25,t+.015); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g).connect(c.destination); o.start(t); o.stop(t+dur+.05); }
function noise(dur,vol,delay,hp){ const c=ac(); if(!c) return; const t=c.currentTime+(delay||0);
  const b=c.createBuffer(1,c.sampleRate*dur,c.sampleRate), d=b.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*(1-i/d.length);
  const n=c.createBufferSource(); n.buffer=b; const f=c.createBiquadFilter(); f.type='highpass'; f.frequency.value=hp||1000;
  const g=c.createGain(); g.gain.value=vol||.3; n.connect(f).connect(g).connect(c.destination); n.start(t); }
const notes=(arr,type,vol,step)=>{ arr.forEach((f,i)=>f&&fx(f,(step||.12)*1.6,type||'triangle',vol||.22,i*(step||.12))); return arr.length*(step||.12); };
const FX=[
  {em:'🎯', nm:'집중! 집중!', say:'집중! 집중! 눈은 선생님, 귀는 쫑긋!', snd:()=>notes([523,659,784,1046],'square',.12,.11)},
  {em:'🚀', nm:'집중 로켓 발사', say:'삼, 이, 일! 집중 로켓 발사!', snd:()=>{ [0,.35,.7].forEach(d=>fx(880,.12,'square',.12,d)); fx(200,1.2,'sawtooth',.15,1.05,1600); noise(1.2,.15,1.05,400); return 1.2; }},
  {em:'🦉', nm:'부엉이 눈', say:'부엉이처럼 눈 크게 뜨고, 집중 모드 온!', snd:()=>{ fx(620,.25,'sine',.25,0,520); fx(620,.35,'sine',.25,.35,480); return .7; }},
  {em:'🤫', nm:'쉿! 뇌 자라는 중', say:'쉿! 지금은 우리 뇌가 쑥쑥 자라는 시간이에요.', snd:()=>{ noise(.9,.18,0,3000); return .8; }},
  {em:'🦸', nm:'집중력 충전 완료', say:'띠링! 집중력 슈퍼파워 충전 완료!', snd:()=>{ fx(300,.6,'square',.1,0,1200); notes([0,0,0,0,0,1046,1318,1568],'triangle',.2,.09); return .9; }},
  {em:'🤐', nm:'입에 지퍼 잠그기', say:'입은 지퍼로 쭈욱 잠그고, 손은 무릎 위에!', snd:()=>{ for(let i=0;i<14;i++) noise(.03,.25,i*.035,2500); fx(1200,.08,'square',.1,.55); return .7; }},
  {em:'🧲', nm:'눈은 자석처럼', say:'모두의 눈이 자석처럼 칠판으로, 착!', snd:()=>{ fx(200,.5,'sine',.2,0,900); fx(1400,.08,'square',.15,.5); return .65; }},
  {em:'🚂', nm:'집중 열차 출발', say:'띵동! 집중 열차가 출발합니다. 떠드는 친구는 다음 역에서 내려요~', snd:()=>notes([659,523,587,392,0,392,587,659,523],'sine',.25,.22)},
  {em:'👏', nm:'들리면 박수 두 번', say:'이 소리가 들리는 친구, 박수 두 번!', snd:()=>{ notes([784,784,1046],'square',.1,.15); return .5; }},

  {em:'🎤', nm:'조용~ 신호', say:'자, 하나 둘 셋 하면 조용! 하나, 둘, 셋!', snd:()=>notes([1046,880,698,523],'sine',.25,.16)},
];
let fxT=0;
function playFx(k){ const f=FX[k]; ac(); const len=(f.snd()||.6);
  if(S.fxBanner){ $('#fxEm').textContent=f.em; $('#fxTx').textContent=f.say; const sh=$('#fxShow'); sh.classList.remove('on'); void sh.offsetWidth; sh.classList.add('on'); }
  clearTimeout(fxT);
  const done=()=>{ fxT=setTimeout(()=>$('#fxShow').classList.remove('on'),1200); };
  if(S.fxVoice && window.speechSynthesis){
    speechSynthesis.cancel();
    setTimeout(()=>{ const u=new SpeechSynthesisUtterance(f.say); u.lang='ko-KR'; u.rate=1.05; u.pitch=1.25;
      const v=speechSynthesis.getVoices().filter(v=>/^ko/i.test(v.lang)); const best=v.find(x=>/Google|Yuna|Heami|SunHi/i.test(x.name))||v[0]; if(best) u.voice=best;
      u.onend=done; u.onerror=done; speechSynthesis.speak(u); }, len*1000+100);
    fxT=setTimeout(()=>$('#fxShow').classList.remove('on'),len*1000+9000);
  } else fxT=setTimeout(()=>$('#fxShow').classList.remove('on'),len*1000+3500);
}
$('#fxGrid').innerHTML=FX.map((f,i)=>`<button data-fx="${i}"><b>${f.em}</b><span>${f.nm}</span></button>`).join('');
$('#fxGrid').onclick=e=>{ const b=e.target.closest('[data-fx]'); if(!b) return; $('#fxPanel').classList.remove('on'); playFx(+b.dataset.fx); };
$('#fxBtn').onclick=e=>{ e.stopPropagation(); $('#fxPanel').classList.toggle('on'); };
document.addEventListener('click',e=>{ if(!e.target.closest('#fxPanel,#fxBtn')) $('#fxPanel').classList.remove('on'); });
$('#fxShow').style.pointerEvents='none';
$('#fxVoice').checked=S.fxVoice; $('#fxBanner').checked=S.fxBanner;
$('#fxVoice').onchange=e=>{ S.fxVoice=e.target.checked; save(); };
$('#fxBanner').onchange=e=>{ S.fxBanner=e.target.checked; save(); };
window.speechSynthesis && speechSynthesis.getVoices();
drawSetup();
drawMode();
</script>
